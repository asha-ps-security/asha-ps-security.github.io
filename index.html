<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Asha P S, SOC Analyst (L1) and Cybersecurity Intern. Threat detection, log analysis, VAPT and DFIR.">
<title>Asha P S | SOC Analyst (L1) &amp; Cybersecurity Portfolio</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#030709;--card:#08121a;--text:#e4f3f8;--muted:#8fa6b3;--accent:#22d3ee;--accent2:#0ea5c6;--line:#12303d;--glow:0 0 22px rgba(34,211,238,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth;height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#mx{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.16;pointer-events:none}
#root{position:relative;z-index:1}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(3,7,9,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
nav b{color:var(--accent);text-shadow:var(--glow)}
nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:.88rem;transition:color .2s}
nav a:hover,nav a:focus-visible{color:var(--accent)}
@media(max-width:760px){nav .links{display:none}}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hero{padding:72px 0 56px;display:grid;gap:36px;grid-template-columns:1.1fr 1fr;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:44px}}
.tag{color:var(--accent);font-size:.9rem}
h1{font-size:clamp(2.6rem,8vw,4.6rem);line-height:1.05;margin:.2em 0;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--accent);text-shadow:var(--glow)}
.title{color:var(--muted);font-size:1.08rem;max-width:560px}
.btn{display:inline-flex;align-items:center;gap:8px;margin:22px 10px 0 0;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600
